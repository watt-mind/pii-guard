# NER v3 (LAB-1393): the wider mix of training/ner/v3_data.py (manifest:
# training/ner/v3-data-manifest.json), after the teacher audit (v3_teachers.py) and the
# decontamination gate (decontam.py). Same data, same settings for both base models; only
# the encoder differs (v3-mmbert-base.toml is the ablation). Fictional / synthetic data only (ADR 0005).
