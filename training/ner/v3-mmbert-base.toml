# NER v3 (LAB-1393): the wider mix of training/ner/v3_data.py (manifest:
# training/ner/v3-data-manifest.json), after the teacher audit (v3_teachers.py) and the
# decontamination gate (decontam.py). Same data, same settings for both base models; only
# the encoder differs (v3-xlmr-base.toml is the baseline recipe). Fictional / synthetic data only (ADR 0005).
#   modal run training/ner/modal_v3.py && <fetch, gate: see eval/results/2026-10-28-ner-v3>
#   modal run training/distill/modal_train.py --config training/ner/v3-mmbert-base.toml --gpu A10G
