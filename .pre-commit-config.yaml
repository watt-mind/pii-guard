repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/ci/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
