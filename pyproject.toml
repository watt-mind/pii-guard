[project]
name = "pii-guard"
version = "0.1.0"
description = "An open-source privacy firewall for AI agents: reversible PII masking for text, documents and images."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "pii-guard contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/watt-mind/pii-guard"

[project.scripts]
pii-guard = "pii_guard.cli:main"

# Language packs (docs/languages.md). A separate distribution adds a language the same way.
[project.entry-points."pii_guard.languages"]
de = "pii_guard.languages.de:pack"
en = "pii_guard.languages.en:pack"
hu = "pii_guard.languages.hu:pack"

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
]
baselines = [
    "en-core-web-lg",
    "hu-core-news-lg",
    "presidio-analyzer==2.2.365",
    "presidio-anonymizer==2.2.365",
    "spacy>=3.8.7,<3.9",
]
# On-device face and ID-photo segmentation (pii_guard.visual.segment, LAB-1229): YuNet on
# OpenCV's CPU DNN. The model file is fetched separately (python -m pii_guard.visual.segment fetch).
local-vision = [
    "opencv-python-headless>=4.10",
]
ner = [
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_guard"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "openai>=3.39.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov=pii_guard", "--cov-report=term-missing"]
markers = ["live: calls a real model endpoint; skipped unless its credentials are set"]
filterwarnings = [
    "error",
    # Starlette's TestClient nudges towards httpx2; httpx is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["pii_guard"]
branch = true
omit = ["*/pytest-of-*/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.uv]
# presidio-analyzer caps numpy below 2.5; resolve the baselines extra on its own so it never
# holds back another extra's numpy.
conflicts = [[{ extra = "baselines" }, { extra = "ner" }]]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
hu-core-news-lg = { url = "https://huggingface.co/huspacy/hu_core_news_lg/resolve/9160ba69dbbcfe1a2346f3c7c2d72831f8250219/hu_core_news_lg-3.8.1-py3-none-any.whl" }
