    <title>pii-guard · privacy gateway for AI agents</title>
    <script>
      // Apply the theme before first paint so dark mode doesn't flash. The local console's
      // first look is light; the hosted build (public landing) follows the system setting.
      (function () {
        var fallback = "%VITE_PII_GUARD_HOSTED%" === "true" ? "system" : "light";
        var pref = fallback;
        try {
          pref = localStorage.getItem("pii-guard:theme") || fallback;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
