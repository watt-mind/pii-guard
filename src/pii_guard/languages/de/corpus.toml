# German document templates for the synthetic corpus (pii_guard.eval.generate).
# Same schema as pii_guard/eval/templates/hu.toml; the identities come from
# pii_guard.languages.de.identities (the pack's identity_generator).

language = "de"
language_name = "German"
inflection_rule = """You may add the genitive -s to names of people and companies (Annas Wohnung, \
die Konten der Lindenhof Immobilien GmbH), but the value itself must stay intact. Give the full \
name in its full form at least once; later you may refer to people by surname with a title \
(Frau Becker, Herr Wagner) or by given name alone."""
typos = " Make it feel real: a few typos, missing umlauts (ae, oe, ue) or casual abbreviations in the surrounding text (never inside the values)."

[field_labels]
name = "name"
date_of_birth = "date of birth (Geburtsdatum)"
address = "address (Anschrift)"
email = "e-mail"
phone = "phone"
id_document = "ID card number (Personalausweisnummer)"
steuer_id = "tax ID (Steuer-ID)"
bank_account = "bank account (IBAN)"
plate = "licence plate (Kfz-Kennzeichen)"
org_name = "name"
given = "given name, for informal address"

[hard_negatives]
instruction = "Also work these ordinary phrases into the text naturally, as written (they are not personal data, do not turn them into names or addresses):"
phrases = [
    "Schwarzer Freitag", "Weißes Haus", "Rotes Kreuz", "Grüne Woche", "Tag der offenen Tür",
    "Gasthof Goldener Hirsch", "Der kleine Prinz", "Deutsche Bahn",
]

[[kinds]]
id = "sale-contract"
title = "Kaufvertrag über ein gebrauchtes Kraftfahrzeug (used car sale contract)"
brief = "A private sale contract for a used car between a seller and a buyer: the parties' details, the vehicle with its licence plate, the price in euros, payment by bank transfer to the seller's account, the 'gekauft wie gesehen' warranty exclusion, handover date, and a place and date line with signature lines."
register = "formal legal German"
length = "250-400"
weight = 2
parties = [
  { role = "seller", label = "Verkäufer", kind = "person", fields = ["name", "date_of_birth", "address", "bank_account", "plate"] },
  { role = "buyer", label = "Käufer", kind = "person", fields = ["name", "address", "id_document"] },
]

[[kinds]]
id = "lease"
title = "Mietvertrag für Wohnraum (residential lease)"
brief = "A residential lease between a property management company as landlord and a tenant: the parties, the flat and its address, the start date, the monthly Kaltmiete and Nebenkosten paid to the landlord's account, the Kaution, house rules, and signature lines."
register = "formal legal German"
length = "300-450"
weight = 2
parties = [
  { role = "landlord", label = "Vermieter", kind = "company", fields = ["org_name", "address", "bank_account"] },
  { role = "agent", label = "the landlord's property manager", kind = "person", fields = ["name"] },
  { role = "tenant", label = "Mieter", kind = "person", fields = ["name", "date_of_birth", "phone", "email"] },
  { role = "property", label = "the rented flat", kind = "property", fields = ["address"] },
]

[[kinds]]
id = "employment"
title = "Arbeitsvertrag (employment contract)"
brief = "An employment contract between a company and an employee: the parties, start date, position, working hours, monthly gross salary paid to the employee's account, holiday entitlement, notice periods, and signature lines. The employee's tax ID appears in the personnel data block."
register = "formal legal German"
length = "250-400"
weight = 1
parties = [
  { role = "employer", label = "Arbeitgeber", kind = "company", fields = ["org_name", "address"] },
  { role = "employee", label = "Arbeitnehmer", kind = "person", fields = ["name", "date_of_birth", "address", "steuer_id", "bank_account"] },
]

[[kinds]]
id = "power-of-attorney"
title = "Vollmacht (power of attorney)"
brief = "A general power of attorney under which a principal authorises an attorney to handle their banking and dealings with authorities, with both parties' details, the scope and duration, and a place, date and signature line."
register = "formal legal German"
length = "150-280"
weight = 1
parties = [
  { role = "principal", label = "Vollmachtgeber", kind = "person", fields = ["name", "date_of_birth", "address", "id_document", "bank_account"] },
  { role = "attorney", label = "Bevollmächtigter", kind = "person", fields = ["name", "address"] },
]

[[kinds]]
id = "court-notice"
title = "Ladung zum Termin (court summons, Amtsgericht)"
brief = "A summons from a local court (Amtsgericht) to a civil hearing: case number (Aktenzeichen), date, time and room, addressed to the defendant, naming the claimant, what to bring, the consequences of not attending, and the court's contact details."
register = "formal official German"
length = "180-300"
weight = 1
parties = [
  { role = "court", label = "the court", kind = "court", fields = ["org_name", "address", "phone"] },
  { role = "defendant", label = "Beklagter (the addressee)", kind = "person", fields = ["name", "address"] },
  { role = "claimant", label = "Kläger", kind = "person", fields = ["name"] },
]

[[kinds]]
id = "invoice"
title = "Rechnung (invoice)"
brief = "A plain-text invoice from a small business to a private customer: supplier block, customer block, invoice number and dates, three or four line items with amounts in euros and 19% VAT (MwSt.), total, and payment details with the supplier's account."
register = "business, terse German"
length = "120-220"
weight = 1
parties = [
  { role = "supplier", label = "Rechnungssteller", kind = "company", fields = ["org_name", "address", "email", "bank_account"] },
  { role = "customer", label = "Kunde", kind = "person", fields = ["name", "address", "phone"] },
]

[[kinds]]
id = "letter"
title = "Behördenschreiben (letter from a citizens' office)"
brief = "A formal letter from a municipal citizens' office (Bürgeramt) to a resident about a residents' parking permit (Bewohnerparkausweis) for their car: the resident's details, the licence plate, what documents to bring, and the office's contact details, signed by a named clerk."
register = "polite formal German (Sie)"
length = "180-300"
weight = 1
parties = [
  { role = "office", label = "the office", kind = "office", fields = ["org_name", "address", "phone", "email"] },
  { role = "clerk", label = "the clerk signing", kind = "person", fields = ["name"] },
  { role = "resident", label = "the resident (addressee)", kind = "person", fields = ["name", "address", "plate"] },
]

[[kinds]]
id = "email"
title = "Informelle E-Mail (informal e-mail)"
brief = "An informal e-mail between friends or family members sorting out paperwork (a flat, a car, a job application): the sender passes on personal details and asks for help. Subject line (Betreff) first, then the message, using du."
register = "informal, chatty German (du)"
length = "90-180"
weight = 2
typos = true
parties = [
  { role = "sender", label = "Absender", kind = "person", fields = ["name", "date_of_birth", "id_document", "phone", "email"], informal = true },
  { role = "recipient", label = "Empfänger", kind = "person", fields = ["name"], informal = true },
]

[[kinds]]
id = "chat"
title = "Chatverlauf (chat conversation)"
brief = "A short instant-messaging conversation between two people arranging something practical (buying a used bike, subletting a room, paying someone back). Each line starts with the time and the speaker's given name, like '18:42 Anna: ...'. Short messages, emoji-free. At some point both give their full name (for a transfer or a contract) and the other details."
register = "very informal German chat"
length = "80-160"
weight = 2
typos = true
parties = [
  { role = "a", label = "first speaker", kind = "person", fields = ["name", "phone", "bank_account"], informal = true },
  { role = "b", label = "second speaker", kind = "person", fields = ["name", "address", "email"], informal = true },
]
