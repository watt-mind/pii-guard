# The judge's path (LAB-1741): install and run pii-guard the way the README tells someone on a
# clean machine to, on Linux and macOS (arm64), with a fresh uv cache, and prove that it serves
# the UI, masks and restores a chat call, takes an image and stops on Ctrl-C
# (scripts/ci/wheel_smoke.sh). Not on develop PRs or pushes; it runs:
#   - by hand (workflow_dispatch, any ref; default develop);
#   - on release PRs (pull_request to main);
#   - from release.yml (workflow_call): against the exact wheel it built, before anything is
#     published (wheel-artifact), and after the PyPI upload against the published version
#     (pypi-version).
# Windows is not in the matrix: the smoke stops the server with SIGINT, which Git Bash cannot
# deliver to a native Windows process; a Windows run needs its own stop logic (PowerShell).
name: judge-path

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test
        type: string
        default: develop
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      wheel-artifact:
        description: Artifact (this run) holding the built wheel; tests that wheel only
        type: string
        default: ""
      pypi-version:
        description: Published version (or its v tag) to install from PyPI (wattmind-pii-guard==<version>)
        type: string
        default: ""

permissions:
  contents: read

env:
  # Keep in step with ci.yml / release.yml (and the uv image pinned in the Dockerfiles).
  UV_VERSION: "0.13.6"
  # Dispatch: the input; PR: the head commit (fetchable by uv over git+https); otherwise the
  # caller's commit.
  JUDGE_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

jobs:
  # A wheel built the way release.yml builds it (UI bundled, no caches), unless the caller
  # hands one over or names a PyPI version.
  build:
    name: build wheel
    if: ${{ !inputs.wheel-artifact && !inputs.pypi-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.JUDGE_REF }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Wheel with the web UI bundled (make wheel, as release.yml)
        run: make wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judge-wheel
          path: dist/*.whl
          retention-days: 3
          if-no-files-found: error

  judge:
    name: judge (${{ matrix.platform }}, ${{ matrix.source }})
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # linux: the README command as is (PyTorch with CUDA); linux-cpu: with --torch-backend
        # cpu, no CUDA package; macos-intel: no PyTorch build exists, so rules only (LAB-1743).
        platform: [linux, linux-cpu, macos-arm, macos-intel]
        include:
          - { platform: linux, os: ubuntu-latest, flags: "--expect-ner on" }
          - { platform: linux-cpu, os: ubuntu-latest, flags: "--torch-backend cpu --expect-ner on" }
          # Pinned, not macos-latest, so the image changes only on purpose (LAB-1782).
          - { platform: macos-arm, os: macos-15, flags: "--expect-ner on" }
          - { platform: macos-intel, os: macos-15-intel, flags: "--expect-ner off" }
        # The git+ source (README "On your machine") only where we built from a commit.
        source: ${{ fromJSON(inputs.pypi-version && '["pypi"]' || inputs.wheel-artifact && '["wheel"]' || '["wheel", "git"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha || env.JUDGE_REF }}
          persist-credentials: false
      # Fresh uv cache on purpose: this is the judge's cold path, no caches restored.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Image masking needs the tesseract binary with the languages the OCR reads (hun+eng),
      # installed as docs/operations.md says.
      - name: Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-hun
      - name: Tesseract (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tesseract tesseract-lang
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.source == 'wheel'
        with:
          name: ${{ inputs.wheel-artifact || 'judge-wheel' }}
          path: ${{ runner.temp }}/dist
      - name: Wait until PyPI serves the version
        if: matrix.source == 'pypi'
        env:
          VERSION: ${{ inputs.pypi-version }}
        run: |
          VERSION="${VERSION#v}"
          # uv installs from the simple index, which can lag the JSON API after an upload.
          wheel="wattmind_pii_guard-$VERSION-py3-none-any.whl"
          for _ in $(seq 1 30); do
            curl -fsS -H "Cache-Control: no-cache" https://pypi.org/simple/wattmind-pii-guard/ \
              | grep -qF "$wheel" && exit 0
            sleep 10
          done
          echo "::error::PyPI does not serve wattmind-pii-guard $VERSION"
          exit 1
      - name: uvx --python 3.12 --from <source> pii-guard up, then healthz, UI, chat, image, Ctrl-C
        env:
          SOURCE: ${{ matrix.source }}
          FLAGS: ${{ matrix.flags }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha || env.JUDGE_REF }}
          VERSION: ${{ inputs.pypi-version }}
          DIST: ${{ runner.temp }}/dist
          PII_GUARD_SMOKE_PORT: "18790"
          PII_GUARD_SMOKE_LOG: ${{ runner.temp }}/pii-guard-up.log
        run: |
          # FLAGS is a list of options: split on purpose.
          # shellcheck disable=SC2086
          case "$SOURCE" in
            wheel)
              wheel="$(find "$DIST" -name '*.whl' | head -n 1)"
              scripts/ci/wheel_smoke.sh --python 3.12 $FLAGS --image "$wheel" ;;
            git)
              # No UI in a source install (ui/dist is not committed): the page must say so.
              scripts/ci/wheel_smoke.sh --python 3.12 $FLAGS --image --no-ui \
                --from "wattmind-pii-guard @ git+https://github.com/$REPO@$SHA" ;;
            pypi)
              VERSION="${VERSION#v}"
              scripts/ci/wheel_smoke.sh --python 3.12 $FLAGS --image --from "wattmind-pii-guard==$VERSION" ;;
          esac
      # The server log holds fictional data only (the smoke sends nothing else).
      - name: Upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judge-path-log-${{ matrix.platform }}-${{ matrix.source }}
          path: ${{ runner.temp }}/pii-guard-up.log
          retention-days: 3
          if-no-files-found: ignore
