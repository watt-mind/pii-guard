# What CI checks and why: CONTRIBUTING.md, "What CI checks". `ci-ok` is the one job to require.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  merge_group:
  workflow_dispatch:
  # Nightly full run on the default branch (develop): every test, including the slow ones.
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  # Fresh PR/develop results take precedence; manual and scheduled full runs are isolated.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

env:
  UV_LOCKED: "1"
  # Keep in step with the uv image pinned in Dockerfile/Dockerfile.hosted.
  UV_VERSION: "0.13.6"
  FORCE_COLOR: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
      wheel: ${{ steps.filter.outputs.wheel }}
      hosted: ${{ steps.filter.outputs.hosted }}
      hosted-image: ${{ steps.filter.outputs.hosted-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the merge base, without file contents: only names are compared.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Which parts changed
        id: filter
        shell: bash # pipefail: a failed diff must fail this job, even through tee
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/changes.py | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: mypy (no errors beyond scripts/ci/mypy-baseline.txt)
        run: uv run python scripts/ci/mypy_baseline.py

  # Pull requests, the merge queue and develop pushes run the fast suite (`make test`: no tests
  # marked slow, 25 Hypothesis examples, the fast coverage floor in the Makefile), so a merge to
  # develop is gated in about two minutes (LAB-1446). Pushes to main, nightly and manual runs run
  # every test (`make test-all`) with the coverage floor in pyproject.toml. Both use pytest-xdist.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      # Tests of the committed report follow the smoke job's choice (LAB-1269).
      RENDER_DOCS_ON_MERGE: ${{ vars.RENDER_DOCS_ON_MERGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Exercise the real Azure SDK conditional-write boundary, not only mocks/skips.
      - run: uv sync --extra hosted-azure
      - name: Hosted Azure SDK wire boundary (offline)
        run: |
          uv run --no-sync python -c "import azure.identity, azure.storage.blob"
          uv run --no-sync pytest tests/hosted/test_spend_adapter.py -k real_sdk --no-cov -q
      # The integration e2e fixtures reuse an exact-version npm install already in these
      # prefixes. Muse is deliberately not cached: its test must notice when the official
      # installer starts serving a version other than MUSE_VERSION_CHECKED.
      - name: Cache pinned integration CLI installs (pi, Codex, OpenCode)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pii-guard-pi
            ${{ runner.temp }}/pii-guard-codex
            ${{ runner.temp }}/pii-guard-opencode
          key: >-
            integration-clis-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/pii_guard/integrations/snippets.py',
            'src/pii_guard/integrations/e2e.py') }}
      - name: Test (parallel, coverage floor, derandomized Hypothesis)
        env:
          PYTEST_ADDOPTS: >-
            --durations=30 --junitxml=reports/junit.xml
            --cov-report=xml:reports/coverage.xml
          PII_GUARD_PI_PREFIX: ${{ runner.temp }}/pii-guard-pi
          PII_GUARD_CODEX_PREFIX: ${{ runner.temp }}/pii-guard-codex
          PII_GUARD_OPENCODE_PREFIX: ${{ runner.temp }}/pii-guard-opencode
        run: |
          mkdir -p reports
          if [ "$FULL" = true ]; then
            HYPOTHESIS_PROFILE=ci-full make test-all
          else
            HYPOTHESIS_PROFILE=ci make test
          fi
      # Synthetic fixtures only (AGENTS.md): junit/coverage may name tests and files, never
      # real values. One day is enough to debug the failure that produced them.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ github.run_id }}
          path: reports/
          retention-days: 1
          if-no-files-found: ignore

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --no-dev
      - name: Smoke (demo stack on the mock upstream, offline)
        run: uv run --no-sync python scripts/smoke.py --mode rules
      # Who renders the report: CONTRIBUTING.md, "Generated files" (LAB-1269). With the
      # render-docs workflow on, the committed report is rendered after the merge, so only the
      # inputs are checked here.
      - name: Benchmark report is current (or, rendered after merge, its inputs are valid)
        env:
          RENDER_DOCS_ON_MERGE: ${{ vars.RENDER_DOCS_ON_MERGE }}
        run: |
          if [ "$RENDER_DOCS_ON_MERGE" = true ]; then
            uv run --no-sync pii-guard eval report --validate
          else
            uv run --no-sync pii-guard eval report --check
          fi
      - name: CLI
        run: uv run --no-sync pii-guard --help

  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --no-dev
      - name: Quality regression gate (rules only, offline; eval/gates.json)
        run: uv run --no-sync python -m pii_guard.eval.gate

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          load: true
          push: false
          tags: pii-guard:ci
          cache-from: type=gha
          # Only pushes write the layer cache (writing it takes ~30 s); pull requests read it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Size budget, healthcheck, one masked request on the mock upstream
        run: scripts/ci/docker_smoke.sh pii-guard:ci

  # Secret-free validation of Azure deployment source. The hosted image build is the
  # separate hosted-image job below, so these fast checks do not wait for it serially.
  hosted-infra:
    name: hosted-infra
    needs: changes
    if: needs.changes.outputs.hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bicep compiler (no Azure login)
        run: az bicep install --version v0.48.1
      - name: Install local TLS proxy test dependencies (Linux CI only)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx-light openssl
      - name: Compile Azure templates and check deployment/router scripts
        run: |
          az bicep build --file deploy/azure/main.bicep --stdout > "$RUNNER_TEMP/hosted-arm.json"
          if [ -f deploy/azure/release.bicep ]; then
            az bicep build --file deploy/azure/release.bicep --stdout > "$RUNNER_TEMP/hosted-release-arm.json"
          fi
          shopt -s nullglob
          for script in deploy/azure/*.sh deploy/azure/dev_router/*.sh; do
            bash -n "$script"
            shellcheck "$script"
          done
      - name: Deployment, app binding and Linux TLS proxy regression tests (no cloud calls)
        run: python3 -m unittest discover -s deploy/azure -p 'test_*.py' -v

  # The opt-in production image, in parallel with hosted-infra. The packaging smoke
  # deliberately does not claim deployed auth, readiness or sponsored-provider access.
  hosted-image:
    name: hosted-image
    needs: changes
    if: needs.changes.outputs.hosted-image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build hosted UI and pinned CPU NER image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile.hosted
          load: true
          push: false
          tags: pii-guard:hosted-ci
          cache-from: type=gha,scope=hosted
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=hosted,mode=max' || '' }}
      - name: Bundled UI and offline CPU NER packaging smoke (no network)
        run: docker run --rm --interactive --network none --entrypoint python pii-guard:hosted-ci - < deploy/azure/ci_hosted_smoke.py

  # Build once (LAB-1446): on a develop push, push the image hosted-image just built and tested
  # to the dev registry, so the operator deploys that digest instead of rebuilding it. The
  # dev-image Environment (develop only) holds an OIDC identity with AcrPush on that registry
  # and nothing else. A delivery job: not in ci-ok, so a registry hiccup does not turn CI red.
  # Deploy its digest only after ci-ok is green (docs/private-dev.md).
  hosted-image-push:
    name: hosted-image-push
    needs: [hosted-infra, hosted-image]
    if: >-
      github.repository == 'watt-mind/pii-guard' && github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-image
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: Image reference
        run: |
          [[ "$AZURE_ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]] || { echo "::error::Set AZURE_ACR_NAME on the dev-image Environment"; exit 1; }
          echo "image=${AZURE_ACR_NAME}.azurecr.io/pii-guard" >> "$GITHUB_OUTPUT"
          echo "tag=develop-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to the dev registry (AcrPush only)
        run: az acr login --name "$AZURE_ACR_NAME" --output none
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same inputs as hosted-image's build, which just wrote this cache: every layer is a hit.
      - id: image
        name: Push the hosted image hosted-image built
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: Dockerfile.hosted
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=hosted
      - name: Pushed digest
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::No digest from the push"; exit 1; }
          {
            echo "### Dev image"
            echo
            echo "- tag: \`$IMAGE:$TAG\`"
            echo "- HOSTED_IMAGE: \`$IMAGE@$DIGEST\`"
            echo
            echo "Deploy only after ci-ok on this commit is green."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE $IMAGE@$DIGEST"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen: audit uv.lock as committed, without resolving. Nothing is downloaded, which
      # matters for the baselines extra (never installed in CI; its HuSpaCy wheel is ~400 MB).
      - name: Python dependency audit (OSV; every extra and group in uv.lock)
        env:
          UV_LOCKED: "false"
        run: uv audit --frozen --preview-features audit
      - name: Install the runtime set only (no dev group, the image's ocr extra)
        if: ${{ !cancelled() }}
        run: uv sync --no-dev --extra ocr
      - name: Python licences (no GPL/AGPL at runtime)
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/ci/licenses.py

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The build, the tests and the typecheck read the benchmark index from
      # `pii-guard eval report --print-index` (ui/vite.config.ts), so pii-guard is installed.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install pii-guard (builds the benchmark index)
        run: uv sync --no-dev
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test --run
      - name: Build
        run: pnpm build
      # Audit and licences run even when an earlier step failed: they are independent gates.
      - name: Audit (production dependencies, high and critical fail)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level high
      - name: Licences (no GPL/AGPL in production dependencies)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm licenses list --prod --json > "$RUNNER_TEMP/ui-licenses.json"
          python3 ../scripts/ci/licenses.py --pnpm-json "$RUNNER_TEMP/ui-licenses.json"

  # The release wheel path (LAB-1276): `make wheel` bundles the built UI, then the wheel is
  # installed in a throwaway environment and `pii-guard up` is smoke-tested on the mock upstream.
  wheel:
    name: wheel
    needs: changes
    if: needs.changes.outputs.wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build the wheel with the web UI (size budget 5 MiB, UI present)
        run: make wheel
      - name: uv tool run --from dist/*.whl pii-guard up, then /healthz, /, one chat, traffic log
        run: scripts/ci/wheel_smoke.sh dist/*.whl

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: CI helper and hosted deployment policy tests (offline; no cloud credentials)
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: actionlint (workflow lint; shellcheck on run blocks)
        run: scripts/ci/actionlint.sh
      - name: shellcheck (CI shell scripts)
        run: shellcheck scripts/ci/*.sh
      - name: zizmor (workflow security lint)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format=github --min-severity=low .github/workflows

  pii-in-diff:
    name: pii-in-diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only while the allow-list settles: findings show as annotations on the PR but do
    # not fail ci-ok yet (follow-up ticket to make it blocking).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --no-dev
      - name: Real-looking PII on the lines this PR adds (pii-guard rules, dogfood)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync python scripts/ci/pii_in_diff.py --base "$BASE"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the commits this change adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/gitleaks.sh "$BASE" "$HEAD"

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relative links in README.md and docs/** (offline; external links run weekly)
        run: scripts/ci/lychee.sh --offline

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [
        changes,
        lint,
        types,
        test,
        smoke,
        eval-gate,
        docker,
        hosted-infra,
        hosted-image,
        audit,
        ui,
        wheel,
        workflows,
        pii-in-diff,
        gitleaks,
        links,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed (or was skipped on purpose)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error title=ci-ok::failed or cancelled: $bad"
            exit 1
          fi

  # Disabled until reviewed identity, network, durable budget and release gates are configured.
  # No PR/merge-group/nightly/manual test run can enter this credential-bearing flow.
  hosted-deployment:
    needs: ci-ok
    if: >-
      needs.ci-ok.result == 'success' && github.repository == 'watt-mind/pii-guard' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      vars.HOSTED_DEPLOYMENTS_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
    # Local relative calls resolve to this commit; retain actionlint-compatible syntax.
    uses: ./.github/workflows/hosted-deploy.yml # zizmor: ignore[self-repository]
