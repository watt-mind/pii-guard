# Release on a version tag (v*): the container image to GHCR and the wheel (web UI bundled) +
# sdist on the GitHub release, so `docker run ghcr.io/watt-mind/pii-guard:<version>` and
# `uvx --from <release wheel URL> pii-guard up` work (LAB-1276).
# Only this workflow can write: packages (the image) and contents (the release). The release
# and PyPI wait for judge-path (judge-path.yml: the wheel installed and run on Linux and macOS
# with a fresh uv cache); after PyPI, pypi-smoke runs the README's PyPI command (LAB-1741).
#
# PyPI (distribution `wattmind-pii-guard`): trusted publishing, off until the repository
# variable PYPI_PUBLISH is "true". PyPI side, once: a (pending) trusted publisher with owner
# watt-mind, repository pii-guard, workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Keep in step with the uv image pinned in Dockerfile/Dockerfile.hosted.
  UV_VERSION: "0.13.6"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail closed: a tag creates no ci.yml run, so prove the tagged commit already passed
  # ci-ok as a main/develop push before anything is published (LAB-1553).
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful ci-ok for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_gate.py

  image:
    name: image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # No build cache: a release image is built from scratch.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  wheel:
    name: wheel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # No pnpm or uv cache: a release is built from scratch.
      - name: Wheel with the web UI bundled (size budget, UI present)
        run: make wheel
      - name: Smoke-test the wheel as users run it (uv tool run ... pii-guard up)
        run: scripts/ci/wheel_smoke.sh dist/*.whl
      - name: Sdist
        run: uv build --sdist
      # The judge-path job tests exactly these files before the release exists.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # Required (LAB-1741): the built wheel installed and run as a judge would, with a fresh uv
  # cache on Linux and macOS (judge-path.yml). Red = no GitHub release, nothing on PyPI.
  judge-path:
    name: judge-path
    needs: wheel
    permissions:
      contents: read
    uses: ./.github/workflows/judge-path.yml # zizmor: ignore[self-repository]
    with:
      wheel-artifact: release-dist

  github-release:
    name: github-release
    needs: [wheel, judge-path]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Attach to the GitHub release (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --generate-notes --verify-tag
          fi

  # Publishes exactly the files attached to the release. Off by default: set the repository
  # variable PYPI_PUBLISH=true once the PyPI project and its trusted publisher exist.
  pypi:
    name: pypi
    needs: [github-release, judge-path]
    if: vars.PYPI_PUBLISH == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wattmind-pii-guard/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no token is stored anywhere
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Download the release's wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always dist/*

  # After the upload (LAB-1741): the README's PyPI command, `uvx --python 3.12 --from
  # wattmind-pii-guard==<version> pii-guard up`, on Linux and macOS. Non-blocking (the release
  # is out); a red run files an issue instead, like ci.yml's nightly-notify.
  pypi-smoke:
    name: pypi-smoke
    needs: pypi
    permissions:
      contents: read
    uses: ./.github/workflows/judge-path.yml # zizmor: ignore[self-repository]
    with:
      pypi-version: ${{ github.ref_name }} # the tag; judge-path drops the leading v

  pypi-smoke-notify:
    name: pypi-smoke-notify
    needs: pypi-smoke
    if: ${{ always() && needs.pypi-smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File an issue for the red post-publish smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Post-publish PyPI smoke failed for $TAG" \
            --body "uvx --python 3.12 --from wattmind-pii-guard==${TAG#v} pii-guard up failed on Linux or macOS after the PyPI upload. Run: $RUN_URL. Triage the failure and file follow-ups in Linear (project PII Guard, team LAB)."
