# Release on a version tag (v*): the container image to GHCR and the wheel (web UI bundled) +
# sdist on the GitHub release, so `docker run ghcr.io/watt-mind/pii-guard:<version>` and
# `uvx --from <release wheel URL> pii-guard up` work (LAB-1276).
# Only this workflow can write: packages (the image) and contents (the release).
#
# PyPI (distribution `wattmind-pii-guard`): trusted publishing, off until the repository
# variable PYPI_PUBLISH is "true". PyPI side, once: a (pending) trusted publisher with owner
# watt-mind, repository pii-guard, workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # No build cache: a release image is built from scratch.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  wheel:
    name: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # No pnpm or uv cache: a release is built from scratch.
      - name: Wheel with the web UI bundled (size budget, UI present)
        run: make wheel
      - name: Smoke-test the wheel as users run it (uv tool run ... pii-guard up)
        run: scripts/ci/wheel_smoke.sh dist/*.whl
      - name: Sdist
        run: uv build --sdist
      - name: Attach to the GitHub release (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --verify-tag
          fi

  # Publishes exactly the files attached to the release. Off by default: set the repository
  # variable PYPI_PUBLISH=true once the PyPI project and its trusted publisher exist.
  pypi:
    name: pypi
    needs: wheel
    if: vars.PYPI_PUBLISH == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wattmind-pii-guard/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no token is stored anywhere
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Download the release's wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always dist/*
