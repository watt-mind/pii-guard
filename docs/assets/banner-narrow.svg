<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="t d">
  <title id="t">pii-guard</title>
  <desc id="d">pii-guard, a privacy gateway for AI agents: personal data is swapped for reversible placeholders before the model sees it and put back in the answer.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6f36b" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#0c0d10" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1d23" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="640" height="900" rx="20" fill="#0c0d10"/>
  <rect width="640" height="900" rx="20" fill="url(#grid)"/>
  <rect width="640" height="900" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="639" height="899" rx="19.5" fill="none" stroke="#262a32"/>

  <!-- Logo: the UI's shield mark -->
  <g transform="translate(48 48) scale(2)">
    <rect width="32" height="32" rx="8" fill="#14161a" stroke="#262a32" stroke-width="0.4"/>
    <path d="M16 5.5 7.5 9v6.4c0 5.3 3.6 9.7 8.5 11.1 4.9-1.4 8.5-5.8 8.5-11.1V9L16 5.5Z" fill="none" stroke="#b6f36b" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M11.5 15.5h9" stroke="#b6f36b" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="128" y="100" class="sans" font-size="56" font-weight="700" fill="#eceef2" letter-spacing="-1">pii-guard</text>

  <text x="48" y="180" class="sans" font-size="34" font-weight="600" fill="#eceef2">A privacy gateway for AI agents.</text>
  <text x="48" y="228" class="sans" font-size="24" fill="#a3a7b0">Personal data becomes reversible</text>
  <text x="48" y="260" class="sans" font-size="24" fill="#a3a7b0">placeholders before it leaves</text>
  <text x="48" y="292" class="sans" font-size="24" fill="#a3a7b0">your network, and comes back</text>
  <text x="48" y="324" class="sans" font-size="24" fill="#a3a7b0">in the answer.</text>

  <!-- The round trip, stacked so each line stays legible at phone width -->
  <g transform="translate(48 372)">
    <rect width="544" height="150" rx="14" fill="#14161b" stroke="#262a32"/>
    <text x="24" y="38" class="sans" font-size="15" font-weight="600" fill="#b6f36b" letter-spacing="1.2">YOU SEND</text>
    <text x="24" y="76" class="mono" font-size="25" fill="#eceef2">Email <tspan fill="#d4f9a8">Jane Placeholder</tspan>:</text>
    <text x="24" y="114" class="mono" font-size="25" fill="#d4f9a8">jane@example.net</text>
  </g>
  <g transform="translate(48 538)">
    <rect width="544" height="150" rx="14" fill="#14161b" stroke="#262a32"/>
    <text x="24" y="38" class="sans" font-size="15" font-weight="600" fill="#9fb0ff" letter-spacing="1.2">THE MODEL SEES</text>
    <text x="24" y="76" class="mono" font-size="25" fill="#eceef2">Email <tspan fill="#9fb0ff">[[PERSON_7f3a]]</tspan>:</text>
    <text x="24" y="114" class="mono" font-size="25" fill="#9fb0ff">[[EMAIL_20c2]]</text>
  </g>
  <g transform="translate(48 704)">
    <rect width="544" height="150" rx="14" fill="#14161b" stroke="#262a32"/>
    <text x="24" y="38" class="sans" font-size="15" font-weight="600" fill="#b6f36b" letter-spacing="1.2">YOU GET BACK</text>
    <text x="24" y="76" class="mono" font-size="25" fill="#eceef2">Done: emailed</text>
    <text x="24" y="114" class="mono" font-size="25" fill="#d4f9a8">Jane Placeholder.</text>
  </g>
</svg>
