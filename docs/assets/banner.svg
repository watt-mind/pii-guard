<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">pii-guard</title>
  <desc id="d">pii-guard, a privacy firewall for AI agents: personal data is swapped for reversible placeholders before the model sees it and put back in the answer.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6f36b" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#0c0d10" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a1d23" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect width="1280" height="360" rx="20" fill="#0c0d10"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#262a32"/>

  <!-- Logo: the UI's shield mark -->
  <g transform="translate(64 64) scale(3)">
    <rect width="32" height="32" rx="8" fill="#14161a" stroke="#262a32" stroke-width="0.4"/>
    <path d="M16 5.5 7.5 9v6.4c0 5.3 3.6 9.7 8.5 11.1 4.9-1.4 8.5-5.8 8.5-11.1V9L16 5.5Z" fill="none" stroke="#b6f36b" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M11.5 15.5h9" stroke="#b6f36b" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="186" y="128" class="sans" font-size="60" font-weight="700" fill="#eceef2" letter-spacing="-1.5">pii-guard</text>

  <text x="64" y="212" class="sans" font-size="30" font-weight="600" fill="#eceef2">A privacy firewall for AI agents.</text>
  <text x="64" y="254" class="sans" font-size="21" fill="#a3a7b0">Personal data becomes reversible placeholders before it</text>
  <text x="64" y="284" class="sans" font-size="21" fill="#a3a7b0">leaves your network, and comes back in the answer.</text>
  <text x="64" y="324" class="sans" font-size="16" fill="#737782">Built on Meta’s open models · runs on your machine · Apache-2.0</text>

  <!-- The round trip, in three lines -->
  <g transform="translate(700 50)">
    <rect width="516" height="260" rx="14" fill="#14161b" stroke="#262a32"/>
    <text x="24" y="38" class="sans" font-size="13" font-weight="600" fill="#b6f36b" letter-spacing="1.2">YOU SEND</text>
    <text x="24" y="68" class="mono" font-size="18" fill="#eceef2">Email <tspan fill="#d4f9a8">Jane Placeholder</tspan>: <tspan fill="#d4f9a8">jane@example.net</tspan></text>
    <line x1="24" y1="90" x2="492" y2="90" stroke="#262a32"/>
    <text x="24" y="122" class="sans" font-size="13" font-weight="600" fill="#9fb0ff" letter-spacing="1.2">THE MODEL SEES</text>
    <text x="24" y="152" class="mono" font-size="18" fill="#eceef2">Email <tspan fill="#9fb0ff">[[PERSON_7f3a]]</tspan>: <tspan fill="#9fb0ff">[[EMAIL_20c2]]</tspan></text>
    <line x1="24" y1="174" x2="492" y2="174" stroke="#262a32"/>
    <text x="24" y="206" class="sans" font-size="13" font-weight="600" fill="#b6f36b" letter-spacing="1.2">YOU GET BACK</text>
    <text x="24" y="236" class="mono" font-size="18" fill="#eceef2">Done: e-mailed <tspan fill="#d4f9a8">Jane Placeholder</tspan>.</text>
  </g>
</svg>
