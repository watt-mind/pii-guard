<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Leak vs over-masking: lower-left is better</title>
<desc id="d">Scatter of leak rate against over-masking rate on 990 fictional agent-traffic documents; lower-left is better. PII Guard (fast, NER v4.2): leak 0.2%, over-masking 0.7%; PrivAiTe: leak 2.4%, over-masking 35.2%; Presidio: leak 16.6%, over-masking 33.4%; LLM Guard: leak 20.2%, over-masking 16.9%; PII Guard rules only: leak 38.8%, over-masking 0.0%.</desc>
<rect x="0" y="0" width="1080" height="1080" fill="#FFFFFF"/>
<text x="56" y="89.4" font-size="41.8" fill="#16171B" font-weight="700">Leak vs over-masking: lower-left is better</text>
<text x="56" y="126.5" font-size="21.8" fill="#55565F">990 fictional agent-traffic documents (de, en, hu) · same documents and scorer for every tool</text>
<text x="56" y="1038" font-size="14.5" fill="#55565F">Runs 2026-10-30 · generated by pii-guard eval report from the run records in eval/results/runs/</text>
<text x="1024" y="1038" font-size="18.1" fill="#16171B" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="56" y="1011.8" font-size="18.1" fill="#55565F">Leak: labeled personal values left readable. Over-masking: masks on text that was not personal data.</text>
