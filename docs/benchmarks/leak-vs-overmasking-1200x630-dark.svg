<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Leak vs over-masking: lower-left is better</title>
<desc id="d">Scatter of leak rate against over-masking rate on 990 fictional agent-traffic documents; lower-left is better. PII Guard (fast, NER v4.2): leak 0.2%, over-masking 0.7%; PrivAiTe: leak 2.4%, over-masking 35.2%; Presidio: leak 16.6%, over-masking 33.4%; LLM Guard: leak 20.2%, over-masking 16.9%; PII Guard rules only: leak 38.8%, over-masking 0.0%.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#0F1115"/>
<text x="44" y="72.2" font-size="35.2" fill="#F2F3F5" font-weight="700">Leak vs over-masking: lower-left is better</text>
<text x="44" y="104.8" font-size="19.2" fill="#B4B6BF">990 fictional agent-traffic documents (de, en, hu) · same documents and scorer for every tool</text>
<text x="44" y="597" font-size="15.2" fill="#B4B6BF">Runs 2026-10-30 · generated by pii-guard eval report from the run records in eval/results/runs/</text>
<text x="1156" y="597" font-size="15.2" fill="#F2F3F5" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="44" y="575" font-size="15.2" fill="#B4B6BF">Leak: labeled personal values left readable. Over-masking: masks on text that was not personal data.</text>
