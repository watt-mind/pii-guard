<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">PII Guard: 0.2 % of personal values reached the model</title>
<desc id="d">Stat card. On 990 fictional agent-traffic documents, PII Guard (fast, NER v4.2) leaked 0.2 % with 0.7 % over-masking; PrivAiTe leaked 2.4 % with 35.2 % over-masking; Presidio leaked 16.6 % with 33.4 % over-masking; LLM Guard leaked 20.2 % with 16.9 % over-masking. Masks personal data before it reaches the LLM, and puts it back in the answer. github.com/watt-mind/pii-guard</desc>
<rect x="0" y="0" width="1200" height="630" fill="#0F1115"/>
<text x="44" y="65.8" font-size="27.2" fill="#F2F3F5" font-weight="700">PII Guard</text>
<text x="179.1" y="65.8" font-size="19.2" fill="#B4B6BF">open-source privacy gateway for AI agents</text>
<text x="44" y="532.8" font-size="22.4" fill="#F2F3F5" font-weight="600">Masks personal data before it reaches the LLM, and puts it back in the answer.</text>
<text x="44" y="597" font-size="15.2" fill="#B4B6BF">Runs 2026-10-30 · generated from the committed run records</text>
<text x="1156" y="597" font-size="15.2" fill="#F2F3F5" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="44" y="575" font-size="15.2" fill="#B4B6BF">990 fictional agent-traffic documents (German, English and Hungarian) · same documents and scorer for every tool</text>
<text x="39.5" y="196.6" font-size="112" fill="#C9F78F" font-weight="700">0.2%</text>
<text x="363.5" y="149.6" font-size="30.4" fill="#F2F3F5" font-weight="600">of personal values reached the model</text>
<text x="363.5" y="182.9" font-size="20.8" fill="#B4B6BF">over-masking 0.7 % · rules + local NER, on CPU</text>
<text x="44" y="221" font-size="16.3" fill="#B4B6BF">Leak: share of labeled personal values that reached the model</text>
