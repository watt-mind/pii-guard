<text x="64" y="140" font-size="24" fill="#55565F">Each cell: leak · over-masking · lower is better · bold: the lowest in its row, per metric</text>
<text x="64" y="852" font-size="19" fill="#55565F">Runs 2026-10-27 to 2026-10-30 · generated by pii-guard eval report from the run records in eval/results/runs/</text>
<text x="1536" y="852" font-size="19" fill="#16171B" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="64" y="824.5" font-size="19" fill="#55565F">Leak: labeled personal values left readable. Over-masking: masks on text that was not personal data. All documents are fictional.</text>
