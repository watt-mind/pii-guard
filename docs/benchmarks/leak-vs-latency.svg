<line x1="150" y1="670" x2="1530" y2="670" stroke="#8A8A93" stroke-width="2"/>
<text x="840" y="742" font-size="22" fill="#1B1B1F" text-anchor="middle">Detection latency per document, p50 (line to p95)</text>
<text x="48" y="435" font-size="22" fill="#1B1B1F" text-anchor="middle" transform="rotate(-90 48 435)">Full leak rate</text>
<text x="166" y="654" font-size="20" fill="#4A4A52">better ↙</text>
<circle cx="66" cy="151" r="10" fill="#0072B2" stroke="#FFFFFF" stroke-width="3"/>
<text x="86" y="158" font-size="20" fill="#4A4A52">pii-guard (filled, one colour per configuration)</text>
<rect x="538.5" y="142.5" width="17" height="17" fill="#FFFFFF" stroke="#595959" stroke-width="4"/>
<text x="567" y="158" font-size="20" fill="#4A4A52">open-source comparison tools (hollow, grey)</text>
<text x="56" y="780" font-size="20" fill="#4A4A52">Fixture set &#x27;smoke&#x27; (hand-written; de 10 docs + en 10 docs + es 5 docs + fr 5 docs + ga 5 docs + hr 5 docs + hu 31 docs + it 5 docs + lt 5 docs + lv 5 docs + mt 5 docs + nl 5 docs + ro 5 docs + sl 5 docs), de + en + es + fr + ga + hr + hu + it + lt + lv + mt + nl + ro + sl pooled (micro-averaged). Small sets: a few points of difference is noise.</text>
<text x="56" y="810" font-size="20" fill="#4A4A52">Not shown, not run on every current fixture file (de + en + es + fr + ga + hr + hu + it + lt + lv + mt + nl + ro + sl): rules, fast, NER v2.0 (published watt-mind/pii-guard-ner-xlmr-base, LAB-1306), rules + Muse Spark Open (Baseten), rules + Muse Glimmer (low), Presidio, LLM Guard, PrivAiTe.</text>
<text x="56" y="840" font-size="20" fill="#4A4A52">Latency measured where each system ran (remote API, H100, laptop CPU): see docs/benchmarks.md; not a like-for-like speed test.</text>
<text x="56" y="870" font-size="20" fill="#4A4A52">Runs no runs · commits  · generated by `pii-guard eval report` from eval/results/runs/</text>
</svg>
