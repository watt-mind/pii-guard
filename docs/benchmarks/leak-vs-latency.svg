<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Leak rate vs latency</title>
<desc id="d">Scatter of full leak rate against detection latency for each system on the smoke fixtures: </desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="56" y="70" font-size="40" fill="#1B1B1F" font-weight="700">Leak rate vs latency</text>
<text x="56" y="112" font-size="24" fill="#4A4A52">Full leak rate (lower is safer) vs detection latency per document (log scale, faster is left)</text>
<line x1="150" y1="647.6" x2="1530" y2="647.6" stroke="#E3E3E8" stroke-width="2"/>
<text x="134" y="654.6" font-size="20" fill="#4A4A52" text-anchor="end">0%</text>
<line x1="150" y1="423.8" x2="1530" y2="423.8" stroke="#E3E3E8" stroke-width="2"/>
<text x="134" y="430.8" font-size="20" fill="#4A4A52" text-anchor="end">10%</text>
<line x1="150" y1="200" x2="1530" y2="200" stroke="#E3E3E8" stroke-width="2"/>
<text x="134" y="207" font-size="20" fill="#4A4A52" text-anchor="end">20%</text>
<line x1="150" y1="200" x2="150" y2="670" stroke="#E3E3E8" stroke-width="2"/>
<text x="150" y="704" font-size="20" fill="#4A4A52" text-anchor="middle">0.10 ms</text>
<line x1="426" y1="200" x2="426" y2="670" stroke="#E3E3E8" stroke-width="2"/>
<text x="426" y="704" font-size="20" fill="#4A4A52" text-anchor="middle">1.0 ms</text>
<line x1="702" y1="200" x2="702" y2="670" stroke="#E3E3E8" stroke-width="2"/>
<text x="702" y="704" font-size="20" fill="#4A4A52" text-anchor="middle">10 ms</text>
<line x1="978" y1="200" x2="978" y2="670" stroke="#E3E3E8" stroke-width="2"/>
<text x="978" y="704" font-size="20" fill="#4A4A52" text-anchor="middle">100 ms</text>
<line x1="1254" y1="200" x2="1254" y2="670" stroke="#E3E3E8" stroke-width="2"/>
<text x="1254" y="704" font-size="20" fill="#4A4A52" text-anchor="middle">1.0 s</text>
<line x1="1530" y1="200" x2="1530" y2="670" stroke="#E3E3E8" stroke-width="2"/>
