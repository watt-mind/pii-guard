<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Leak vs over-masking: lower-left is better</title>
<desc id="d">Scatter of leak rate against over-masking rate on 990 fictional agent-traffic documents; lower-left is better. PII Guard (fast, NER v4.2): leak 0.2%, over-masking 0.7%; PrivAiTe: leak 2.4%, over-masking 35.2%; Presidio: leak 16.6%, over-masking 33.4%; LLM Guard: leak 20.2%, over-masking 16.9%; PII Guard rules only: leak 38.8%, over-masking 0.0%.</desc>
<rect x="0" y="0" width="1600" height="900" fill="#0F1115"/>
<text x="64" y="99.2" font-size="44" fill="#F2F3F5" font-weight="700">Leak vs over-masking: lower-left is better</text>
<text x="64" y="140" font-size="24" fill="#B4B6BF">990 fictional agent-traffic documents (de, en, hu) · same documents and scorer for every tool</text>
<text x="64" y="852" font-size="19" fill="#B4B6BF">Runs 2026-10-30 · generated by pii-guard eval report from the run records in eval/results/runs/</text>
<text x="1536" y="852" font-size="19" fill="#F2F3F5" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="64" y="824.5" font-size="19" fill="#B4B6BF">Leak: labeled personal values left readable. Over-masking: masks on text that was not personal data.</text>
<rect x="132" y="590.2" width="348.5" height="134.7" fill="#1A1D23"/>
<line x1="132" y1="724.9" x2="1526" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="120" y="731.9" font-size="20" fill="#B4B6BF" text-anchor="end">0%</text>
<line x1="132" y1="590.2" x2="1526" y2="590.2" stroke="#2E3139" stroke-width="2"/>
<text x="120" y="597.2" font-size="20" fill="#B4B6BF" text-anchor="end">10%</text>
<line x1="132" y1="455.5" x2="1526" y2="455.5" stroke="#2E3139" stroke-width="2"/>
<text x="120" y="462.5" font-size="20" fill="#B4B6BF" text-anchor="end">20%</text>
<line x1="132" y1="320.7" x2="1526" y2="320.7" stroke="#2E3139" stroke-width="2"/>
<text x="120" y="327.7" font-size="20" fill="#B4B6BF" text-anchor="end">30%</text>
<line x1="132" y1="186" x2="1526" y2="186" stroke="#2E3139" stroke-width="2"/>
<text x="120" y="193" font-size="20" fill="#B4B6BF" text-anchor="end">40%</text>
<line x1="132" y1="186" x2="132" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="132" y="754.9" font-size="20" fill="#B4B6BF" text-anchor="middle">0%</text>
<line x1="480.5" y1="186" x2="480.5" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="480.5" y="754.9" font-size="20" fill="#B4B6BF" text-anchor="middle">10%</text>
<line x1="829" y1="186" x2="829" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="829" y="754.9" font-size="20" fill="#B4B6BF" text-anchor="middle">20%</text>
<line x1="1177.5" y1="186" x2="1177.5" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="1177.5" y="754.9" font-size="20" fill="#B4B6BF" text-anchor="middle">30%</text>
<line x1="1526" y1="186" x2="1526" y2="724.9" stroke="#2E3139" stroke-width="2"/>
<text x="1526" y="754.9" font-size="20" fill="#B4B6BF" text-anchor="middle">40%</text>
<line x1="132" y1="724.9" x2="1526" y2="724.9" stroke="#7D808A" stroke-width="2"/>
<line x1="132" y1="186" x2="132" y2="724.9" stroke="#7D808A" stroke-width="2"/>
<text x="829" y="786.4" font-size="21" fill="#F2F3F5" text-anchor="middle">Over-masking → (share of masks on non-personal text)</text>
<text x="72.4" y="455.5" font-size="21" fill="#F2F3F5" text-anchor="middle" transform="rotate(-90 72.4 455.5)">Leak → (share of personal values left readable)</text>
<text x="468.5" y="616.2" font-size="20" fill="#B4B6BF" text-anchor="end" font-weight="600">↙ better</text>
<circle cx="157.8" cy="722.1" r="16.2" fill="#B6F36B" stroke="#0F1115" stroke-width="4.9"/>
