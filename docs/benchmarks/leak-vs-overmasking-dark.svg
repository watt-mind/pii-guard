<text x="172.1" y="686.3" font-size="23" fill="#C9F78F" font-weight="700">PII Guard (fast, NER v4.2)</text>
<text x="172.1" y="710.7" font-size="19" fill="#B4B6BF">leak 0.2% · over-masking 0.7%</text>
<text x="1039.3" y="687.2" font-size="23" fill="#F2F3F5" font-weight="700">PrivAiTe</text>
<text x="1039.3" y="711.5" font-size="19" fill="#B4B6BF">leak 2.4% · over-masking 35.2%</text>
<text x="967.9" y="496.7" font-size="23" fill="#F2F3F5" font-weight="700">Presidio</text>
<text x="967.9" y="521" font-size="19" fill="#B4B6BF">leak 16.6% · over-masking 33.4%</text>
<text x="392.8" y="447.4" font-size="23" fill="#F2F3F5" font-weight="700">LLM Guard</text>
<text x="392.8" y="471.7" font-size="19" fill="#B4B6BF">leak 20.2% · over-masking 16.9%</text>
<text x="158" y="196.6" font-size="23" fill="#F2F3F5" font-weight="700">PII Guard rules only</text>
<text x="158" y="221" font-size="19" fill="#B4B6BF">leak 38.8% · over-masking 0.0%</text>
