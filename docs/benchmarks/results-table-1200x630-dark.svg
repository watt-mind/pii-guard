<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="t">Leak and over-masking, set by set</title>
<desc id="d">Table of leak and over-masking per fixture set; lower is better, the lowest per metric in each row in bold. Hand-written (62 docs · de, en, hu, pl): PII Guard fast leak 0.0%, over-masking 1.3%; PrivAiTe leak 13.0%, over-masking 25.7%; Presidio leak 25.5%, over-masking 26.1%; LLM Guard leak 46.3%, over-masking 33.7%. Agent traffic (990 docs · de, en, hu): PII Guard fast leak 0.2%, over-masking 0.7%; PrivAiTe leak 2.4%, over-masking 35.2%; Presidio leak 16.6%, over-masking 33.4%; LLM Guard leak 20.2%, over-masking 16.9%. Nemotron-PII (300 docs · en): PII Guard fast leak 0.6%, over-masking 1.5%; PrivAiTe leak 4.0%, over-masking 5.6%; Presidio leak 12.8%, over-masking 32.0%; LLM Guard leak 28.8%, over-masking 0.6%. CEE-PII (451 docs · en, hu): PII Guard fast leak 0.8%, over-masking 7.3%; PrivAiTe leak 4.4%, over-masking 59.2%; Presidio leak 36.5%, over-masking 52.5%; LLM Guard leak 75.8%, over-masking 66.4%. Gretel finance (400 docs · de, en): PII Guard fast leak 19.1%, over-masking 24.4%; PrivAiTe leak 27.7%, over-masking 46.5%; Presidio leak 18.8%, over-masking 75.4%; LLM Guard leak 59.3%, over-masking 17.0%.</desc>
<rect x="0" y="0" width="1200" height="630" fill="#0F1115"/>
<text x="44" y="72.2" font-size="35.2" fill="#F2F3F5" font-weight="700">Leak and over-masking, set by set</text>
<text x="44" y="104.8" font-size="19.2" fill="#B4B6BF">Each cell: leak · over-masking · lower is better · bold: the lowest in its row, per metric</text>
<text x="44" y="597" font-size="15.2" fill="#B4B6BF">Runs 2026-10-27 to 2026-10-30 · generated by pii-guard eval report from the run records in eval/results/runs/</text>
<text x="1156" y="597" font-size="15.2" fill="#F2F3F5" text-anchor="end" font-weight="600">github.com/watt-mind/pii-guard</text>
<text x="44" y="575" font-size="15.2" fill="#B4B6BF">Leak: labeled personal values left readable. Over-masking: masks on text that was not personal data. All documents are fictional.</text>
